name: Collect Binance data

on:
  schedule:
    - cron: "7 * * * *"   # every hour at minute 7 (UTC)
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: collect-binance
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Collect snapshot
        run: python collectors/binance.py

      - name: Save data to the repo
        run: |
          git config user.name "pumpguard-bot"
          git config user.email "pumpguard-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: binance snapshot $(date -u +'%Y-%m-%d %H:00 UTC')"
          git pull --rebase
          git push
